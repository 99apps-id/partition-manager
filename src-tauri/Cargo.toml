[package]
name = "partition-manager"
version = "1.0.0"
description = "Professional Partition Manager for Windows"
authors = ["99apps-id"]
edition = "2021"

[lib]
name = "partition_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
